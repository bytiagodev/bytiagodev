<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="840" height="170" role="img" aria-label="A small face looking at two rows of labels. Languages: HTML, CSS, JavaScript, TypeScript. Tools: React, Next.js, Tailwind, Supabase, Git">
  <title>A small face looking at two rows of labels. Languages: HTML, CSS, JavaScript, TypeScript. Tools: React, Next.js, Tailwind, Supabase, Git</title>
  <style>
    .pt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #52525b; }
    .lb { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; letter-spacing: 1px; fill: #66666e; }
    .face { transform-origin: 97.5px 133px; animation: lean 9s ease-in-out infinite; }
    .box { transform-box: fill-box; transform-origin: center; animation: breathe 9s ease-in-out infinite; }
    .eyes { animation: glance 9s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 9s linear infinite; }
    @keyframes glance { 0%,22%{transform:translateX(0)} 27%,72%{transform:translateX(10px)} 77%,100%{transform:translateX(0)} }
    @keyframes lean   { 0%,22%{transform:rotate(0deg)} 27%,72%{transform:rotate(2deg)} 77%,100%{transform:rotate(0deg)} }
    @keyframes blink  { 0%,11.5%{transform:scaleY(1)} 12.6%{transform:scaleY(0.1)} 13.7%,59%{transform:scaleY(1)} 60.1%{transform:scaleY(0.1)} 61.2%,100%{transform:scaleY(1)} }
    @keyframes breathe{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.012)} }
    @media (prefers-reduced-motion: reduce) { .face,.box,.eyes,.eye { animation: none } }
    .ink { fill: #3f3f46; }
    .ink-line { stroke: #3f3f46; }
    .dot { font-size: 16px; }
    @media (prefers-color-scheme: dark) { .pt { fill: #d1d1d8; } .lb { fill: #a1a1aa; } .ink { fill: #e4e4e7; } .ink-line { stroke: #e4e4e7; } }
  </style>

  <g class="face">
    <rect class="box" x="25" y="35" width="145" height="98" rx="24" fill="none" stroke="#D9553F" stroke-width="4.5"/>
    <g class="eyes">
      <g transform="translate(69.5 76)"><g class="eye"><rect x="-11" y="-7.5" width="22" height="15" rx="7.5" class="ink"/></g></g>
      <g transform="translate(125.5 76)"><g class="eye"><rect x="-11" y="-7.5" width="22" height="15" rx="7.5" class="ink"/></g></g>
    </g>
    <path d="M77.5 106 Q 97.5 110 117.5 106" class="ink-line" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>

  <text class="lb" x="245" y="48">LANGUAGES</text>
  <text class="pt" x="245" y="74"><tspan class="dot" fill="#e34c26" dy="-1">●</tspan><tspan dx="6" dy="1">HTML</tspan><tspan class="dot" fill="#663399" dx="20" dy="-1">●</tspan><tspan dx="6" dy="1">CSS</tspan><tspan class="dot" fill="#f1e05a" dx="20" dy="-1">●</tspan><tspan dx="6" dy="1">JavaScript</tspan><tspan class="dot" fill="#3178c6" dx="20" dy="-1">●</tspan><tspan dx="6" dy="1">TypeScript</tspan></text>
  <text class="lb" x="245" y="108">TOOLS</text>
  <text class="pt" x="245" y="134"><tspan class="dot" fill="#D9553F" dy="-1">○</tspan><tspan dx="6" dy="1">React</tspan><tspan class="dot" fill="#D9553F" dx="20" dy="-1">○</tspan><tspan dx="6" dy="1">Next.js</tspan><tspan class="dot" fill="#D9553F" dx="20" dy="-1">○</tspan><tspan dx="6" dy="1">Tailwind</tspan><tspan class="dot" fill="#D9553F" dx="20" dy="-1">○</tspan><tspan dx="6" dy="1">Supabase</tspan><tspan class="dot" fill="#D9553F" dx="20" dy="-1">○</tspan><tspan dx="6" dy="1">Git</tspan></text>
</svg>
